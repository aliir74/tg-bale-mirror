[project]
name = "tg-bale-mirror"
version = "0.1.0"
description = "One-way mirror of a Telegram channel to a Bale messenger channel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # pyrofork is a drop-in fork of pyrogram that supports 64-bit channel peer
    # IDs (upstream pyrogram 2.0.106 still rejects channels with IDs above 2^31
    # which Telegram now routinely issues).
    "pyrofork>=2.3",
    "tgcrypto>=1.2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pyright>=1.1",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests", ".venv"]
reportMissingImports = false
reportPrivateImportUsage = false
reportGeneralTypeIssues = "warning"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "PLC0415",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
